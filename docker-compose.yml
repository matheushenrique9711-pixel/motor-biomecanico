version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motor-biomecanico-backend
    ports:
      - "8000:8000"
    environment:
      # FastAPI environment variables
      - PYTHONUNBUFFERED=1
      - API_TITLE=Motor Biomecânico API
      - API_VERSION=1.0.0
      # Database Configuration (Phase 4)
      - DATABASE_URL=postgresql://motor_user:${DB_PASSWORD:-motor_secure_password}@postgres:5432/motor_biomecanico
      - DB_PASSWORD=${DB_PASSWORD:-motor_secure_password}
    volumes:
      # Mount STL exports directory for persistence
      - stl_exports:/tmp/stl_exports
      # Development: mount source code for hot reload
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - motor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motor-biomecanico-frontend
    ports:
      - "3000:3000"
    environment:
      # React environment variables
      - REACT_APP_API_URL=http://backend:8000/api
      # Vite environment
      - VITE_API_URL=http://backend:8000/api
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - motor-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Note: For development with hot reload, use docker-compose.dev.yml instead

  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: motor-biomecanico-db
    environment:
      POSTGRES_DB: motor_biomecanico
      POSTGRES_USER: motor_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-motor_secure_password}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - motor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motor_user -d motor_biomecanico"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  stl_exports:
    driver: local
  postgres_data:
    driver: local

networks:
  motor-network:
    driver: bridge
