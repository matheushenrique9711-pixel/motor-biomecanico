version: '3.8'

# Development Docker Compose Configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# This overlay adds hot reload capabilities for development

services:
  backend:
    volumes:
      # Hot reload for backend: mount entire app directory
      - ./backend/app:/app/app
    command: |
      sh -c "pip install watchdog[watchmedo] &&
             watchmedo auto-restart -d /app/app -p '*.py' --
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug

  frontend:
    # Override the build to use development server
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"  # Vite dev server port
      - "3000:3000"  # Fallback production port
    volumes:
      # Hot reload for frontend: mount source code
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules  # Don't mount node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
    command: npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
