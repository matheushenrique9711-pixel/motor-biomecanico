# Alembic Configuration File
# For database migrations

[alembic]
# path to migration scripts
sqlalchemy.url = driver://user:password@localhost/dbname
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(slug)s_%%(ts)s

# sys.path path, will be prepended to sys.path if present
# as a list of paths separated by the standard os.pathsep
# character within the string value below. See the Python documentation
# for an example of installations using this technique.
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the constructor of datetime.datetime
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field that's appended to a revision file
# when using an autogenerate revision
# (see --autogenerate argument to `alembic revision`)
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# as_revision_base = false

# set to 'false' to disable automatic generation of
# new revisions when model files in the target are newer
# than the last revision in the script directory
# compare_type = false
# compare_server_default = false
# compare_items = false

# Logging configuration
# Loggers to use with SQLAlchemy-Utils must be defined here
# A list of loggers is available on request
# disable existing loggers during the logging setup
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
